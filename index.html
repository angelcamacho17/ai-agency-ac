<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Michelangelo Devs. Agentes de IA que responden, califican y cierran</title>
    <meta
      name="description"
      content="Michelangelo Devs es una agencia de agentes de IA que construye agentes de ventas en producción para WhatsApp, Instagram y web, en vivo en menos de dos semanas. Escríbenos por WhatsApp."
    />
    <link rel="canonical" href="https://michelangelodevs.com/" />

    <!-- Open Graph. The WhatsApp unfurler runs no JS and this is the
         conversion channel, so these tags do real work every time someone
         forwards the link in a chat. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Michelangelo Devs" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://michelangelodevs.com/" />
    <meta property="og:title" content="Michelangelo Devs. Agentes de IA que responden, califican y cierran" />
    <meta
      property="og:description"
      content="Agentes de ventas con IA para WhatsApp, Instagram y tu web. En vivo en menos de dos semanas."
    />
    <meta property="og:image" content="https://michelangelodevs.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Michelangelo Devs. Agentes de IA que venden" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Michelangelo Devs. Agentes de IA que responden, califican y cierran" />
    <meta
      name="twitter:description"
      content="Agentes de ventas con IA para WhatsApp, Instagram y tu web. En vivo en menos de dos semanas."
    />
    <meta name="twitter:image" content="https://michelangelodevs.com/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Stamps html.jsready so the CSS crawler safety net in index.css can
         release its !important un-hiding rules. Inline and synchronous on
         purpose: if this never runs, every animated element stays visible. -->
    <script>
      document.documentElement.classList.add('jsready')
    </script>

    <!-- BUILD-INJECTED-JSONLD -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
